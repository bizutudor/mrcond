[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrcond"
version = "0.1.0"
description = "MRCond: an open benchmark and evidence-grounded pipeline for MR Conditional implant labeling (research prototype, not a medical device)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tudor-Costin Bizu" }]
keywords = ["MRI safety", "MR Conditional", "implants", "information extraction", "benchmark", "LLM", "RAG"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "pydantic>=2.6,<3",
  "pypdf>=5.0,<7",
  "beautifulsoup4>=4.12",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]
reports = ["matplotlib>=3.8"]

[project.scripts]
mrcond = "mrcond.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: needs internet access (enable with MRCOND_NETWORK_TESTS=1)",
  "live_llm: needs a running local LLM server (enable with MRCOND_LIVE_LLM=1)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# long string literals are left to the formatter; (str, Enum) is kept on purpose (str() of members is used)
ignore = ["E501", "UP042"]
